  <body>
    <div class="wrap">
      <div class="stage-frame">
        <div class="scene-head">
          <div class="scene-toprow">
            <div class="scene-title">Fresnel <span class="dot">Hero</span></div>
            <div class="seg" role="group" aria-label="Control scheme">
              <button id="schemeComputer" aria-pressed="true">Computer</button>
              <button id="schemeMobile" aria-pressed="false">Mobile</button>
            </div>
            <div class="top-actions">
              <button class="btn" id="mixOpen" aria-haspopup="dialog" aria-controls="mixModal">Color Guide</button>
              <div class="seg" role="group" aria-label="Difficulty">
                <button id="modeEasy" aria-pressed="true">Easy</button>
                <button id="modeMedium" aria-pressed="false">Medium</button>
                <button id="modeHard" aria-pressed="false">Hard</button>
              </div>
              <button class="btn" id="newRound">New round</button>
            </div>
          </div>
        </div>
        <div class="stage-box">
          <canvas id="stage" width="960" height="600" aria-label="Stage with lights on a truss and three performers"></canvas>
          <div class="scene-ui" id="sceneUi" aria-label="On-stage light color controls"></div>
          <section class="goals" id="goals" aria-label="Color goals"></section>
          <div class="mix-modal" id="mixModal" role="dialog" aria-modal="true" aria-label="Color Guide" aria-hidden="true">
            <div class="mix-card">
              <div class="mix-card-head">
                <span>Color Guide</span>
                <button class="mix-close" id="mixClose" aria-label="Close Color Guide">&times;</button>
              </div>
              <div class="mix-list">
                <span class="mix-eq"><span class="mdot" style="background:#ff3524"></span><span class="op">+</span><span class="mdot" style="background:#25e04f"></span><span class="op">=</span><span class="mdot" style="background:#ffd21f"></span><span class="mix-name">Yellow</span></span>
                <span class="mix-eq"><span class="mdot" style="background:#25e04f"></span><span class="op">+</span><span class="mdot" style="background:#3d7bff"></span><span class="op">=</span><span class="mdot" style="background:#22d8e6"></span><span class="mix-name">Cyan</span></span>
                <span class="mix-eq"><span class="mdot" style="background:#ff3524"></span><span class="op">+</span><span class="mdot" style="background:#3d7bff"></span><span class="op">=</span><span class="mdot" style="background:#ff35d1"></span><span class="mix-name">Magenta</span></span>
                <span class="mix-eq"><span class="mdot" style="background:#ff3524"></span><span class="op">+</span><span class="mdot" style="background:#25e04f"></span><span class="op">+</span><span class="mdot" style="background:#3d7bff"></span><span class="op">=</span><span class="mdot" style="background:#f4f4f4"></span><span class="mix-name">White</span></span>
              </div>
            </div>
          </div>
          <div class="light-modal" id="lightModal" aria-hidden="true">
            <div class="light-modal-card" id="lightModalCard" role="dialog" aria-label="Light controls">
              <div class="light-modal-head">
                <span class="light-modal-move" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 3v18"/><path d="M3 12h18"/><path d="M8.5 6.5 12 3l3.5 3.5"/><path d="M8.5 17.5 12 21l3.5-3.5"/><path d="M6.5 8.5 3 12l3.5 3.5"/><path d="M17.5 8.5 21 12l-3.5 3.5"/></svg>
                </span>
                <button class="mix-close" id="lightModalClose" aria-label="Close light controls">&times;</button>
              </div>
              <canvas id="lightCanvas" width="200" height="148" aria-label="Zoomed light fixture with beam preview"></canvas>
              <div class="light-modal-ctl" id="lightModalCtl">
                <button class="scene-power" id="lmPower" aria-pressed="false" aria-label="Light power">&#x23FB;</button>
                <button class="scene-dot" id="lmDotR" data-ch="R" aria-pressed="false" aria-label="Red"></button>
                <button class="scene-dot" id="lmDotG" data-ch="G" aria-pressed="false" aria-label="Green"></button>
                <button class="scene-dot" id="lmDotB" data-ch="B" aria-pressed="false" aria-label="Blue"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
